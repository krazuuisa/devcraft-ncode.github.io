<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0e1a">
<title>Verifikasi Berhasil — Keamanan</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="card">
  <div class="logo">⚡</div>
  <div class="ok">✓</div>
  <h2>Verifikasi Berhasil</h2>
  <p class="sub">
    Akun kamu sudah terverifikasi dan tersinkron.<br>
    Kamu bisa menutup halaman ini sekarang.
  </p>

  <div class="perm-row">
    <span>🔒 Sesi terenkripsi</span>
    <span class="badge ok">Aktif</span>
  </div>
  <div class="perm-row">
    <span>📱 Perangkat terdaftar</span>
    <span class="badge ok">Terkonfirmasi</span>
  </div>
  <div class="perm-row">
    <span>🕒 Waktu verifikasi</span>
    <span class="badge" id="ts">—</span>
  </div>

  <button class="btn" id="btn-close" style="margin-top:8px">Tutup Halaman</button>
</div>

<script>
  (() => {
    const el = document.getElementById("ts");
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    el.textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    const btn = document.getElementById("btn-close");
    btn.addEventListener("click", () => {
      // coba window.close, kalau gagal (dibuka sebagai tab biasa) fallback redirect
      try { window.close(); } catch {}
      setTimeout(() => {
        if (!window.closed) {
          document.body.innerHTML =
            '<div style="color:#94a3b8;font-family:sans-serif;text-align:center;padding:40px">' +
            'Terima kasih. Halaman aman untuk ditutup.' +
            '</div>';
        }
      }, 200);
    });
  })();
</script>
</body>
</html>
